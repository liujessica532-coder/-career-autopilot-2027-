<!doctype html><html lang="zh"><meta charset="utf-8"><title>授权浏览器会话</title><link rel="stylesheet" href="/assets/panel.css"><main><h1>授权浏览器会话</h1><p>下面是当前申请的真实浏览器。手动点击完成验证码或登录；系统不会破解验证码。操作只作用于此申请。请确认本页个人信息及声明后再恢复自动流程。</p><div class="toolbar"><input id="text" type="password" autocomplete="off" placeholder="向当前聚焦字段输入文字（不记录内容）"><button id="send">输入文字</button><button data-key="Tab">Tab</button><button data-key="Shift+Tab">上一字段</button><button data-key="Backspace">退格</button><button data-key="Control+A">全选</button><button data-key="Enter">Enter</button><button id="resume">我已正常完成验证并核对本页，继续</button></div><p id="message" role="status"></p><img id="screen" alt="当前授权申请的浏览器画面" draggable="false"><p>会话10分钟后失效。不要把验证码、密码、浏览器状态或令牌发送到聊天或提交到Git。</p></main><script src="/assets/panel.js"></script></html>
